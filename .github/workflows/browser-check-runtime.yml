name: Prepare browser test runtime
on:
  push:
    paths:
      - .github/workflows/browser-check-runtime.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx playwright install chromium-headless-shell
      - name: Package browser runtime for isolated verification
        run: tar -C "$HOME/.cache/ms-playwright" -czf browser-runtime.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: browser-check-runtime
          path: browser-runtime.tar.gz
          retention-days: 1
